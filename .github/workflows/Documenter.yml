name: Documentation

# Building the documentation runs every sweep in the study — twenty-four of them, up to
# 112 runs each — so `deploydocs` publishes from `main` and tags only.
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Widened to `write` on the deploying job only.
permissions:
  contents: read

jobs:
  # Each job runs `make.jl` restricted to one page, which is not for the rendered output —
  # that is discarded — but for the sweeps the page's `@example` blocks execute:
  # `cached_sweep` writes them to `SOLVERBENCHMARK_SWEEP_CACHE`, and this job uploads that
  # directory. The `documenter` job then renders the whole site from the collected CSVs
  # without recomputing anything.
  #
  # `sweeps` splits a page finer than the page itself, by naming the cache keys this job
  # is to compute; the page's other sweeps raise `SweepNotSelected` and are skipped. The
  # implicit-midpoint pages take the whole page (two sweeps of 96 runs, and the slower of
  # the two is the fine time step). The nonlinear pages get one job per time step: three
  # sweeps of 112 runs each, and they set the critical path of the whole workflow, so
  # splitting them is what shortens it.
  sweep:
    name: Sweep ${{ matrix.id }}
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      # One diverging integrator must not stop the remaining sweeps from being computed.
      fail-fast: false
      matrix:
        include:
          - { id: harmonic_oscillator,    page: harmonic_oscillator, sweeps: '' }
          - { id: pendulum,               page: pendulum,            sweeps: '' }
          - { id: lotka_volterra_2d,      page: lotka_volterra_2d,   sweeps: '' }
          - { id: lotka_volterra_4d,      page: lotka_volterra_4d,   sweeps: '' }
          - { id: double_pendulum,        page: double_pendulum,     sweeps: '' }
          - { id: toda_lattice,           page: toda_lattice,        sweeps: '' }
          - { id: nl_harmonic_oscillator_dt0.1,  page: nonlinear_harmonic_oscillator, sweeps: nonlinear_harmonic_oscillator_dt0.1 }
          - { id: nl_harmonic_oscillator_dt1.0,  page: nonlinear_harmonic_oscillator, sweeps: nonlinear_harmonic_oscillator_dt1.0 }
          - { id: nl_harmonic_oscillator_dt10.0, page: nonlinear_harmonic_oscillator, sweeps: nonlinear_harmonic_oscillator_dt10.0 }
          - { id: nl_pendulum_dt0.1,             page: nonlinear_pendulum, sweeps: nonlinear_pendulum_dt0.1 }
          - { id: nl_pendulum_dt1.0,             page: nonlinear_pendulum, sweeps: nonlinear_pendulum_dt1.0 }
          - { id: nl_pendulum_dt10.0,            page: nonlinear_pendulum, sweeps: nonlinear_pendulum_dt10.0 }
          - { id: nl_double_pendulum_dt0.1,      page: nonlinear_double_pendulum, sweeps: nonlinear_double_pendulum_dt0.1 }
          - { id: nl_double_pendulum_dt1.0,      page: nonlinear_double_pendulum, sweeps: nonlinear_double_pendulum_dt1.0 }
          - { id: nl_double_pendulum_dt10.0,     page: nonlinear_double_pendulum, sweeps: nonlinear_double_pendulum_dt10.0 }
          - { id: nl_toda_lattice_dt0.1,         page: nonlinear_toda_lattice, sweeps: nonlinear_toda_lattice_dt0.1 }
          - { id: nl_toda_lattice_dt1.0,         page: nonlinear_toda_lattice, sweeps: nonlinear_toda_lattice_dt1.0 }
          - { id: nl_toda_lattice_dt10.0,        page: nonlinear_toda_lattice, sweeps: nonlinear_toda_lattice_dt10.0 }
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      # All jobs of this workflow share one depot cache: the default cache name includes
      # the job name and the matrix values, which would give one near-identical cache per
      # matrix cell and a cold cache in the `documenter` job.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }}
          include-matrix: false
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      # Pinned to Julia 1.11 on macOS. On Linux with Julia 1.12 (LLVM 18.1.7) these
      # sweeps abort mid-run with a silent SIGABRT, which a core dump identified as
      # `llvm::SelectionDAGISel::CannotYetSelect` — LLVM's X86 backend failing to select an
      # instruction while the JIT compiles a method, calling `report_fatal_error` and so
      # `abort()`. Because it aborts inside LLVM it never becomes a Julia exception, which
      # is why it produced no error, no stack trace and nothing on stderr even under a pty.
      # It hit a different sweep each run — the host's target features and which
      # specialization is compiled decide, not the benchmark — so retrying was useless.
      # Neither BLAS threading nor OpenBLAS kernel dispatch was involved; both were tested
      # and changed nothing.
      #
      # arm64 macOS uses a different LLVM backend entirely and has never reproduced it, on
      # CI or locally. Revisit once a Julia release carries a fixed LLVM.
      - name: Runner diagnostics
        run: |
          julia -e 'using InteractiveUtils; versioninfo(verbose = false)'
          julia -e 'using LinearAlgebra; @show BLAS.get_config(); @show BLAS.get_num_threads()'
          sysctl -n machdep.cpu.brand_string
          echo "memory: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB, $(sysctl -n hw.ncpu) cores"
      # Under a pty: Julia buffers `stdout`/`stderr` when they are pipes, as they are here,
      # so a twenty-minute sweep would show nothing until it finished. BSD `script` takes
      # the command as trailing arguments rather than util-linux's `-e -c`, and propagates
      # the command's exit status (verified: `exit 7` gives 7, an abort gives 6).
      - name: Compute the sweeps
        run: script -q /dev/null julia --project=docs docs/make.jl
        env:
          DOCS_PAGES: ${{ matrix.page }}.md
          SOLVERBENCHMARK_SWEEPS: ${{ matrix.sweeps }}
          SOLVERBENCHMARK_SWEEP_CACHE: ${{ github.workspace }}/sweepcache
      - uses: actions/upload-artifact@v7
        with:
          name: sweeps-${{ matrix.id }}
          path: sweepcache
          retention-days: 1

  # Collect every page's sweeps, then build and deploy the site.
  documenter:
    name: Documenter
    needs: sweep
    # Build even when some sweeps failed, so that there is a build log and a site to look
    # at; the deployment itself is gated on a complete run below. `!cancelled()` still
    # respects cancellation through the `concurrency` group.
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }}
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            Pkg.precompile()'
      - name: Doctests
        run: |
          julia --project=docs -e '
            using Documenter: DocMeta, doctest
            using SolverBenchmark
            DocMeta.setdocmeta!(SolverBenchmark, :DocTestSetup, :(using SolverBenchmark); recursive=true)
            doctest(SolverBenchmark)'
      - name: Collect the computed sweeps
        uses: actions/download-artifact@v4
        with:
          pattern: sweeps-*
          merge-multiple: true
          path: sweepcache
      # A page whose sweep job failed has no CSV, so its `@example` blocks would silently
      # recompute the sweep here and blow this job's budget instead of failing. Name the
      # gap explicitly.
      - name: Report the collected sweeps
        run: |
          ls -la sweepcache
          echo "collected $(ls sweepcache/*.csv 2>/dev/null | wc -l) sweeps (expected 24)"
      # Under a pty for the same reason as the sweep jobs: this build runs for minutes and
      # buffered output would only appear at the end. BSD `script` form, as on macOS.
      - name: Build and deploy
        run: script -q /dev/null julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          SOLVERBENCHMARK_SWEEP_CACHE: ${{ github.workspace }}/sweepcache
          # `needs.sweep.result` is `success` exactly when every matrix job succeeded.
          DEPLOY_DOCS: ${{ needs.sweep.result == 'success' }}
      # Nothing was deployed in that case, so keep the site around for inspection.
      - name: Upload the site of an incomplete build
        if: ${{ always() && needs.sweep.result != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: documenter-site
          path: docs/build
          retention-days: 7
          if-no-files-found: ignore
